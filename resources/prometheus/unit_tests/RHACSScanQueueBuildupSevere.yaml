rule_files:
  - /tmp/prometheus-rules-test.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: rox_image_scan_semaphore_queue_size{namespace="rhacs-test789", subsystem="central", entity="central-image-scan-service", requestedFrom="n/a"}
        values: "150+0x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: RHACSScanQueueBuildupSevere
        exp_alerts: []
      - eval_time: 11m
        alertname: RHACSScanQueueBuildupSevere
        exp_alerts:
          - exp_labels:
              alertname: RHACSScanQueueBuildupSevere
              namespace: rhacs-test789
              subsystem: central
              entity: central-image-scan-service
              requestedFrom: "n/a"
              severity: warning
            exp_annotations:
              summary: "Large scan queue detected in namespace `rhacs-test789`."
              description: "The scan queue in namespace `rhacs-test789` has 150 tasks waiting. A queue this large indicates a significant backlog."
              sop_url: "https://gitlab.cee.redhat.com/stackrox/acs-managed-service-runbooks/blob/master/sops/dp-003-rhacs-instance-unavailable.md"
